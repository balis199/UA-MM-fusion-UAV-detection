[project]
name = "ua-mm-fusion-uav-detection"
version = "0.1.0"
description = "Uncertainty-aware multimodal (RGB-T) fusion for UAV detection in adverse and out-of-distribution conditions"
readme = "README.md"
authors = [
    { name = "Mark Schuddeboom", email = "schuddeboom@hotmail.nl" }
]
requires-python = ">=3.13"
license = "MIT"
# only what the installed package (src/thesis) actually imports;
# notebook/script-only tools live in the dev group below
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# the import package is `thesis` (src/thesis), not the normalized project name
[tool.uv.build-backend]
module-name = "thesis"

[dependency-groups]
dev = [
    "datasette>=0.65.6",
    "datasette-render-image-tags>=0.1",
    "distinctipy>=1.3.4",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
    # runtime requirements of the ultralytics/yolov5 torch.hub repo 
    "packaging",
    "psutil",
    "requests>=2.32.2",
    "scipy>=1.4.1",
    "seaborn>=0.11.0",
    "setuptools>=70",
    "ultralytics>=8.4.201",
]

[tool.ruff]
line-length = 100
