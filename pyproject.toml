[project]
name = "thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Schuddeboom", email = "schuddeboom@hotmail.nl" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pathlib>=1.0.1",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
    "typing>=3.10.0.0",
]

[project.scripts]
ua-mm-fusion-uav-detection = "ua_mm_fusion_uav_detection:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
